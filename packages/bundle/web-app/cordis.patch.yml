# @prac/web-app bundle patch layer: prac's composition.
#
# Applied after dsh-web-app's insert, so the shipped rows are addressable by id.
# DSH composes every client plugin as a row, and a patch can disable or insert
# rows — replacing the frame is therefore DSH's own extension point, not a fork.
#
# `ui-layout` stays installed (its types are what other packages augment SlotMap
# with); only its row is taken out of the composition.
- id: ui-layout
  disabled: true

- insert:
    # The frame mechanism: region tree, sashes, collapse, surfaces and the
    # `prac.view` seat; provides `ctx.pracFrame`, `ctx.layout` and the
    # window-group surface factory.
    - id: prac-client-ui-frame
      name: "prac-client-ui-frame"

    # The widget plugin: widget boards / placement and the widget service.
    - id: prac-client-ui-widget
      name: "prac-client-ui-widget"

    # DSH slot vocabulary / keyed-main helpers.
    - id: prac-client-ui-dsh
      name: "prac-client-ui-dsh"

    # The shared VS Code client mechanism: the single VS Code boot (the
    # app may be created only once per page) and the part-host element
    # factory. It declares no seat, so it composes with either seat alone — a
    # deployment that keeps only one seat still gets its app.
    - id: prac-client-vscode-host
      name: "prac-client-vscode-host"

    # The consumers: one row per upstream source, each following the shared
    # catalogue (files from the editor service; views from the view registry).
    # Each is independent: dropping either row leaves a working window, because
    # the boot above does not belong to a consumer.
    - id: prac-client-ui-vscode-editor
      name: "prac-client-ui-vscode-editor"
    - id: prac-client-ui-vscode-views
      name: "prac-client-ui-vscode-views"

    # The VS Code side's host half: the `/prac-vscode` route that serves the
    # built VS Code bundle, and the same-origin proxy to the code server. `prac-vscode`
    # itself is vendor-only — it pins, patches and builds what this row serves,
    # so it has no loader entry and cannot appear here.
    - id: prac-host-vscode
      name: "prac-host-vscode"

    # The changed-files turn-tail card.
    - id: prac-client-ui-changed-files
      name: "prac-client-ui-changed-files"

    # The arrangement / default workbench policy.
    - id: prac-client-ui-workbench
      name: "prac-client-ui-workbench"

    # The language-service seam (`ctx.lsp`) and the tool that exposes it to the
    # agent. No DSH bundle ships either one, so an outside provider has nothing
    # to register into and the model has no way to ask. They resolve at runtime
    # from the DSH installation, like `@deepseek-ai/cordis` does.
    - id: lsp
      name: "@deepseek-ai/dsh-lsp"

    - id: tool-lsp
      name: "@deepseek-ai/dsh-tool-lsp"
