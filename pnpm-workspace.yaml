packages:
  - packages/*/*
  - vendor/*

# The DSH *runtime* still comes from the installation (`ctx`, the loader's
# module table, the served bundles) — these entries are for TYPES and for the
# build-time resolution of the platform words. They are published on npm
# (verified 2026-09-13), pinned exactly: the `latest` dist-tag points at an old
# release, so a range would resolve the wrong thing.
autoInstallPeers: false

catalogMode: prefer

catalog:
  # 活体门的浏览器工具链（prac 侧自己的 tests/gates/）。与上游 checkout 同版本，
  # 这样两边复用同一个浏览器缓存。
  "@playwright/test": 1.61.1
  # DSH's own packages, pinned to the version this repo runs against. Almost all
  # of them are TYPES only (`import type`, erased from the bundles); the one
  # *value* import is `@deepseek-ai/dsh-client-store` in ui-layout's client half,
  # which stays external and is answered at runtime by the shell's module table
  # (see `scripts/pack-client.ts`'s PLATFORM_MODULES) — so no implementation of
  # it is inlined here either.
  "@deepseek-ai/cordis": 4.0.2
  "@deepseek-ai/dsh-api-session-controller": 0.1.5-rc.1
  "@deepseek-ai/dsh-api-workspace-controller": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-ui-layout": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-ui-renderer": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-ui-session": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-store": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-ui-slots": 0.1.5-rc.1
  "@deepseek-ai/dsh-client-ui-theme": 0.1.5-rc.1
  "@deepseek-ai/dsh-host-webserver": 0.1.5-rc.1
  # The language-service seam the VS Code extension host is registered into
  # (`ctx.lsp`). Types only, like the rest: the runtime comes from the DSH
  # installation, and the seam has to be inserted into the composition by hand
  # because no bundle ships it.
  "@deepseek-ai/dsh-lsp": 0.1.5-rc.1
  "@types/node": ^24
  "@types/react": ~18.3.1
  react: ^18.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Optional native accelerators of `ws`, reached only through the toolchain's
# dependency graph. Their build scripts are not needed here, so `pnpm install`
# must not stop on the approval prompt for them.
allowBuilds:
  bufferutil: false
  utf-8-validate: false
